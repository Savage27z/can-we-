<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #131722; width: 1000px; height: 620px;
               overflow: hidden; color: #d1d4dc;
               font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .abs { position: absolute; white-space: nowrap; }
  #title { left: 30px; top: 12px; font-size: 30px; font-weight: 700; line-height: 36px; }
  #status { left: 30px; top: 52px; font-size: 16px; color: #787b86; }
  #legend { left: 30px; top: 74px; font-size: 14px; }
  #badge { right: 18px; top: 14px; font-size: 18px; font-weight: 700; color: #fff; padding: 6px 12px; }
  #news { right: 18px; top: 58px; font-size: 14px; font-weight: 700; color: #f85149; }
  #chart { position: absolute; left: 20px; top: 100px; width: 960px; height: 484px; }
  #overlay { position: absolute; z-index: 10; left: 20px; top: 100px; width: 960px; height: 484px;
             pointer-events: none; overflow: hidden; }
  .box { position: absolute; }
  .boxlabel { position: absolute; font-size: 14px; font-weight: 700; }
  .level { position: absolute; font-size: 15px; line-height: 18px; white-space: nowrap; }
  .foot { font-size: 12px; color: #787b86; top: 594px; }
</style>
</head>
<body>
  <div id="title" class="abs"></div>
  <div id="status" class="abs"></div>
  <div id="legend" class="abs"></div>
  <div id="badge" class="abs"></div>
  <div id="news" class="abs"></div>
  <div id="chart"></div>
  <div id="overlay"></div>
  <div id="asof" class="abs foot" style="left:30px"></div>
  <div class="abs foot" style="right:18px">Structural analysis, not financial advice</div>
  <div class="abs foot" style="left:380px">Chart: TradingView Lightweight Charts&trade; · tradingview.com</div>

<script>/*__LIB__*/</script>
<script>window.SPEC = /*__SPEC__*/null;</script>
<script>
(function () {
  const S = window.SPEC;
  const $ = (id) => document.getElementById(id);
  $('title').textContent = S.header.title;
  $('status').textContent = S.header.status;
  $('asof').textContent = S.header.as_of;
  const legend = $('legend');
  legend.textContent = S.header.legend;
  legend.style.color = S.header.legend_color;
  const badge = $('badge');
  badge.textContent = S.header.bias;
  badge.style.background = S.header.bias_color;
  if (S.header.news) { $('news').textContent = S.header.news; }

  const chart = LightweightCharts.createChart($('chart'), {
    width: 960, height: 484,
    layout: { background: { type: 'solid', color: '#131722' }, textColor: '#787b86', fontSize: 14 },
    grid: { vertLines: { color: '#232733' }, horzLines: { color: '#232733' } },
    rightPriceScale: { borderColor: '#232733', minimumWidth: 92,
                       scaleMargins: { top: 0.02, bottom: 0.02 } },
    timeScale: { borderColor: '#232733', timeVisible: false, secondsVisible: false,
                 tickMarkFormatter: (t) => {
                   const d = new Date(t * 1000);
                   return d.toLocaleString('en-US', { month: 'short', day: '2-digit', timeZone: 'UTC' });
                 } },
    crosshair: { vertLine: { visible: false, labelVisible: false },
                 horzLine: { visible: false, labelVisible: false } },
    handleScroll: false, handleScale: false,
  });

  const series = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    lastValueVisible: false, priceLineVisible: false,
    priceFormat: { type: 'price', precision: S.decimals, minMove: Math.pow(10, -S.decimals) },
    autoscaleInfoProvider: () => ({ priceRange: { minValue: S.y_lo, maxValue: S.y_hi } }),
  });
  series.setData(S.candles);
  if (S.markers.length) series.setMarkers(S.markers);

  const STYLE = { solid: 0, dotted: 1, dashed: 2 };
  S.lines.forEach((l) => series.createPriceLine({
    price: l.price, color: l.color, lineWidth: l.width, lineStyle: STYLE[l.style],
    axisLabelVisible: !!l.tag, title: '',
  }));

  chart.timeScale().setVisibleLogicalRange({ from: -1, to: S.n - 1 + S.pad });

  function fmt(v) { return v.toFixed(S.decimals); }

  function draw() {
    // Plot geometry from the fixed visible range, rather than asking the time scale to
    // convert (it can answer null this early); bar i sits at logical index i.
    const from = -1, to = S.n - 1 + S.pad;
    const plotWidth = 960 - chart.priceScale('right').width();
    const xOf = (logical) => (logical - from) / (to - from) * plotWidth;
    const overlay = $('overlay');
    const xEnd = xOf(S.n - 0.4);
    S.boxes.forEach((b) => {
      let x0 = b.i0 === null ? 0 : xOf(b.i0 - 0.4);
      x0 = Math.max(0, x0);
      const yA = series.priceToCoordinate(b.high);
      const yB = series.priceToCoordinate(b.low);
      if (yA === null || yB === null) return;
      const el = document.createElement('div');
      el.className = 'box';
      const x1 = b.edge ? plotWidth - 4 : xEnd;   // position zones run out to the right edge
      el.style.cssText = `left:${x0}px;top:${Math.min(yA, yB)}px;width:${Math.max(0, x1 - x0)}px;` +
        `height:${Math.max(2, Math.abs(yB - yA))}px;background:${b.color};opacity:${b.alpha};` +
        (b.dashed ? `outline:1px dashed ${b.color};` : '');
      overlay.appendChild(el);
      if (b.label) {
        const t = document.createElement('div');
        t.className = 'boxlabel';
        t.style.cssText = `left:${x0 + 4}px;top:${Math.min(yA, yB) - 20}px;color:${b.color};`;
        t.textContent = b.label;
        overlay.appendChild(t);
      }
    });

    // Level labels, in the padding to the right of the last candle, nudged apart so
    // neighbouring prices never overprint (same idea as the matplotlib chart).
    const placed = [];
    S.labels.map((l) => ({ ...l, y: series.priceToCoordinate(l.price) }))
      .filter((l) => l.y !== null).sort((a, b) => a.y - b.y)
      .forEach((l) => {
        if (placed.length && l.y - placed[placed.length - 1].y < 20) l.y = placed[placed.length - 1].y + 20;
        placed.push(l);
      });
    placed.forEach((l) => {
      const el = document.createElement('div');
      el.className = 'level';
      el.style.cssText = `left:${xEnd + 8}px;top:${l.y - 9}px;color:${l.color};`;
      el.textContent = l.text;
      overlay.appendChild(el);
    });

    // Each zone's size, written inside it at the height furthest from the level labels
    // (the sweep level always sits inside a live trade's stop zone).
    const labelYs = placed.map((l) => l.y);
    S.boxes.filter((b) => b.note && (b.high - b.low) >= S.span * S.min_zone).forEach((b) => {
      const yTop = series.priceToCoordinate(b.high), yBot = series.priceToCoordinate(b.low);
      if (yTop === null || yBot === null) return;
      const candidates = [0.15, 0.3, 0.5, 0.7, 0.85].map((f) => yTop + (yBot - yTop) * f);
      const dist = (c) => Math.min(...labelYs.map((ly) => Math.abs(c - ly)), 1e9);
      const y = candidates.reduce((best, c) => (dist(c) > dist(best) ? c : best), candidates[0]);
      const el = document.createElement('div');
      el.className = 'boxlabel';
      el.style.cssText = `right:${960 - plotWidth + 12}px;top:${y - 9}px;color:${b.color};font-size:15px;`;
      el.textContent = b.note;
      overlay.appendChild(el);
    });
    window.__ready = true;
  }
  requestAnimationFrame(() => requestAnimationFrame(draw));
})();
</script>
</body>
</html>
