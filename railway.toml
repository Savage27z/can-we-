[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# The container's CMD (python -m tgbot.run_bot) is the start command.
# This is a long-polling worker with no HTTP port, so no healthcheck is configured.
#
# ALWAYS, not ON_FAILURE: with a retry cap, a few crashes at startup (e.g. a Telegram
# outage) leave the service down permanently, and an exit code 0 is never restarted.
# A worker that must stay up should simply always restart.
[deploy]
restartPolicyType = "ALWAYS"
